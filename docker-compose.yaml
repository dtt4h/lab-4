services:
  postgres:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_USER: lab4
      POSTGRES_PASSWORD: lab4
      POSTGRES_DB: lab4
    ports: ["5433:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab4 -d lab4"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      DATABASE_URL: postgres://lab4:lab4@postgres:5432/lab4?sslmode=disable
      JWT_SECRET: development-only-change-this-secret
      HTTP_ADDR: :8080
      LOG_FILE: /logs/backend.log
      BOOTSTRAP_ADMIN_EMAIL: dtt4h322@gmail.com
      MIGRATIONS_DIR: /migrations
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports: ["8080:8080"]
    volumes:
      - app-logs:/logs
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
  booking-frontend:
    build: ./booking-frontend
    ports: ["5174:5174"]
    depends_on: [backend]
volumes:
  db-data:
  app-logs:
